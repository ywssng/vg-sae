# Configuration for Variational Garrote sparse regression.
# Paper: Soh et al., "Variational Garrote for Statistical Physics-based Sparse
# and Robust Variable Selection", arXiv:2509.06383.

model:
  n_features: 256
  gamma: 1.0
  mask_init: 0.999
  weight_init_std: 1.0
  loss_eps: 1.0e-12
  dtype: "float32"

training:
  optimizer: "adamw"
  lr: 0.03
  lr_stop: 1.0e-6
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 100
  scheduler_threshold: 1.0e-7
  max_steps: 5000
  gradient_clip_norm: null
  history_every: 25
  seed: 0
  device: "cpu"
  save_checkpoint: false
  checkpoint_path: "outputs/vg_model.pt"

data:
  kind: "synthetic"
  n_features: 256
  n_train: 256
  n_test: 256
  rho_data: 0.01953125
  snr: 3.0
  test_seed_offset: 10000

real_world:
  cc_train_fraction: 0.15
  bf_train_fraction: 0.01
  cc_log_cutoff: -3.0

evaluation:
  mask_threshold: 0.5
  paper_ensemble_count: 20000
  rho_grid_min: 0.001
  rho_grid_max: 0.5
  rho_grid_size: 200
  nnls_steps: 2000
  nnls_lr: 0.05
